<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Dish | Food Fiesta Admin</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body style="background: #f8fafc; display: flex; flex-direction: column; min-height: 100vh;">
    <!-- Simple Navbar for Admin Pages -->
    <nav class="navbar" style="position: sticky; top: 0; z-index: 100;">
        <a href="/admin/services" class="nav-logo" style="text-decoration: none;">
            <i class="fa-solid fa-arrow-left"></i> <span style="margin-left: 8px; font-size: 1.2rem;">Back to Console</span>
        </a>
        <div class="nav-links">
            <a href="/logout" class="btn btn-outline" style="padding: 8px 20px;">Sign Out</a>
        </div>
    </nav>

    <div class="auth-wrapper" style="flex: 1; padding: 60px 5%;">
        <div class="auth-card animate-up" style="max-width: 600px; width: 100%;">
            <div style="margin-bottom: 32px; text-align: center;">
                <div style="width: 56px; height: 56px; background: var(--primary-container); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                    <i class="fa-solid fa-utensils" style="font-size: 1.5rem; color: var(--primary);"></i>
                </div>
                <h2 style="font-size: 1.75rem; margin-bottom: 8px;">Create Menu Item</h2>
                <p style="font-size: 0.875rem; color: var(--on-surface-variant);">Add a delicious new dish to your restaurant's catalog.</p>
            </div>

            <form th:action="@{/addingProduct}" method="post">
                <div style="margin-bottom: 24px;">
                    <label style="font-size: 0.875rem; font-weight: 700; color: var(--on-surface); display: block; margin-bottom: 8px;">
                        <i class="fa-solid fa-tag" style="color: var(--primary); margin-right: 6px;"></i> Dish Name
                    </label>
                    <input type="text" name="pname" class="input-field" placeholder="e.g. Truffle Mushroom Risotto" style="margin-top: 0;" required>
                </div>
                
                <div style="margin-bottom: 24px;">
                    <label style="font-size: 0.875rem; font-weight: 700; color: var(--on-surface); display: block; margin-bottom: 8px;">
                        <i class="fa-solid fa-indian-rupee-sign" style="color: var(--primary); margin-right: 6px;"></i> Price (₹)
                    </label>
                    <input type="number" step="0.01" name="pprice" class="input-field" placeholder="e.g. 450.00" style="margin-top: 0;" required>
                </div>

                <div style="margin-bottom: 24px;">
                    <label style="font-size: 0.875rem; font-weight: 700; color: var(--on-surface); display: block; margin-bottom: 8px;">
                        <i class="fa-solid fa-image" style="color: var(--primary); margin-right: 6px;"></i> Image URL/Path
                    </label>
                    <input type="text" name="imagePath" class="input-field" placeholder="e.g. /Images/pizza/margherita.jpg" style="margin-top: 0;">
                </div>
                
                <div style="margin-bottom: 32px;">
                    <label style="font-size: 0.875rem; font-weight: 700; color: var(--on-surface); display: block; margin-bottom: 8px;">
                        <i class="fa-solid fa-align-left" style="color: var(--primary); margin-right: 6px;"></i> Description
                    </label>
                    <textarea name="pdescription" class="input-field" rows="4" placeholder="Describe the flavors, ingredients, and preparation method..." style="margin-top: 0; resize: vertical;" required></textarea>
                </div>
                
                <div style="display: flex; gap: 16px;">
                    <a href="/admin/services" class="btn btn-outline" style="flex: 1; text-align: center; justify-content: center; padding: 16px;">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="flex: 2; padding: 16px; font-size: 1rem;">
                        Publish to Menu <i class="fa-solid fa-cloud-arrow-up" style="margin-left: 8px;"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer style="padding: 40px; text-align: center; color: var(--on-surface-variant); font-size: 0.875rem;">
        &copy; 2026 Food Fiesta Admin Portal.
    </footer>
</body>
</html>
