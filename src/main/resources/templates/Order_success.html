<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Food Fiesta</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff5f0 0%, #ffeedd 100%);
        }

        .success-card {
            background: white;
            border-radius: 32px;
            padding: 60px 48px;
            max-width: 560px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(176, 47, 0, 0.1);
            text-align: center;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary), #e63900);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon i {
            font-size: 2.5rem;
            color: white;
        }

        .order-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--outline-variant);
        }

        .order-info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 0.875rem;
            color: var(--on-surface-variant);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-weight: 700;
            color: var(--on-surface);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .badge-dine { background: #dcfce7; color: #16a34a; }
        .badge-takeaway { background: #fef3c7; color: #d97706; }
        .badge-delivery { background: #dbeafe; color: #2563eb; }
    </style>
</head>
<body>
    <div class="success-card animate-up">
        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1 style="font-size: 2rem; margin-bottom: 8px;">Order Confirmed! 🎉</h1>
        <p style="color: var(--on-surface-variant); margin-bottom: 32px;">Your delicious meal is on its way. Thank you for choosing Food Fiesta!</p>

        <div style="background: #f8fafc; border-radius: 16px; padding: 24px; margin-bottom: 32px; text-align: left;">
            <div class="order-info-row">
                <span class="info-label">Total Amount</span>
                <span class="info-value" style="font-size: 1.5rem; color: var(--primary);" th:text="'₹ ' + ${amount} + '/-'">₹0/-</span>
            </div>
            <div class="order-info-row">
                <span class="info-label">Order Type</span>
                <span class="badge" 
                    th:classappend="${orderType == 'Dine-In'} ? 'badge-dine' : (${orderType == 'Takeaway'} ? 'badge-takeaway' : 'badge-delivery')"
                    th:text="${orderType != null} ? ${orderType} : 'Standard'">Delivery</span>
            </div>
            <div class="order-info-row" th:if="${orderType == 'Dine-In' and tableNumber != null}">
                <span class="info-label"><i class="fa-solid fa-chair"></i> Table Number</span>
                <span class="info-value" th:text="${tableNumber}">Table 5</span>
            </div>
            <div class="order-info-row">
                <span class="info-label">Status</span>
                <span style="color: #f59e0b; font-weight: 700;"><i class="fa-solid fa-clock"></i> Pending Preparation</span>
            </div>
        </div>

        <a href="/dashboard" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 16px; font-size: 1rem;">
            <i class="fa-solid fa-house" style="margin-right: 8px;"></i> Back to Dashboard
        </a>
    </div>
</body>
</html>
