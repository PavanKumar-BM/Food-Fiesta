<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Food Fiesta</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .menu-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 140px 5% 100px;
        }

        .menu-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .menu-header h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 50px;
        }

        .food-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            transition: var(--transition-soft);
            border: 1px solid var(--outline-variant);
        }

        .food-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
        }

        .image-wrapper {
            width: 100%;
            height: 280px;
            overflow: hidden;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .food-card:hover .image-wrapper img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 25px;
            position: relative;
            background: white;
        }

        .price-tag {
            background: var(--primary);
            color: white;
            padding: 8px 15px;
            border-radius: 50px;
            font-weight: 700;
            position: absolute;
            top: -25px;
            right: 25px;
            box-shadow: 0 8px 15px rgba(176, 47, 0, 0.2);
        }

        .rating {
            color: #ffc107;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: block;
        }

        .buy-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            background: var(--surface-container-low);
            color: var(--on-surface);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition-soft);
        }

        .buy-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Filter Section */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid var(--outline-variant);
            background: white;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition-soft);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <nav th:replace="~{Navigation::navbar()}"></nav>

    <div class="menu-container">
        <div class="menu-header animate-up">
            <span style="color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">Curation</span>
            <h1>The <span style="color: var(--primary);">Fiesta</span> Menu</h1>
            <p style="color: var(--on-surface-variant);">Discover a symphony of flavors crafted by experts.</p>
        </div>

        <div class="filters animate-up" style="animation-delay: 0.1s;">
            <button class="filter-btn active" data-category="all">All Dishes</button>
            <button class="filter-btn" data-category="Biryani">Biryani</button>
            <button class="filter-btn" data-category="Chicken">Chicken</button>
            <button class="filter-btn" data-category="Paneer">Paneer Specialties</button>
            <button class="filter-btn" data-category="Chinese">Chinese</button>
            <button class="filter-btn" data-category="North Indian">North Indian</button>
            <button class="filter-btn" data-category="Beverages">Beverages</button>
        </div>

        <div class="menu-grid">
            <!-- Item 1 -->
            <div class="food-card animate-up" th:each="product : ${products}" 
                 th:attr="data-category=${product.imagePath != null ? (product.imagePath.toLowerCase().contains('biryani') ? 'Biryani' : (product.imagePath.toLowerCase().contains('chicken') ? 'Chicken' : (product.imagePath.toLowerCase().contains('paneer') ? 'Paneer' : (product.imagePath.toLowerCase().contains('chinese') ? 'Chinese' : (product.imagePath.toLowerCase().contains('north-india') ? 'North Indian' : (product.imagePath.toLowerCase().contains('tea') ? 'Beverages' : 'Specials')))))) : 'Specials'}" 
                 style="animation-delay: 0.2s;">
                <div class="image-wrapper">
                    <!-- Use product's imagePath if available, else use a placeholder -->
                    <img th:if="${product.imagePath != null and !product.imagePath.isEmpty()}" th:src="@{${product.imagePath}}" alt="Product Image">
                    <img th:unless="${product.imagePath != null and !product.imagePath.isEmpty()}" th:src="@{/Images/placeholder-food.jpg}" alt="Default Image">
                </div>
                <div class="card-content">
                    <span class="price-tag" th:text="'₹' + ${product.pprice}">₹0.00</span>
                    <span class="rating"><i class="fa fa-star"></i> 4.5+</span>
                    <h3 th:text="${product.pname}">Dish Name</h3>
                    <p style="font-size: 0.9rem; color: var(--on-surface-variant); margin-top: 5px;" th:text="${product.pdescription}">Description goes here.</p>
                    <a href="#" class="buy-btn buy-action">Order Now</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Category Filtering Logic
        const filterBtns = document.querySelectorAll(".filter-btn");
        const foodCards = document.querySelectorAll(".food-card");

        filterBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                // Change active button
                filterBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");

                const category = btn.getAttribute("data-category");

                // Filter cards
                foodCards.forEach(card => {
                    if (category === "all" || card.getAttribute("data-category") === category) {
                        card.style.display = "block";
                        card.classList.add("animate-up");
                    } else {
                        card.style.display = "none";
                    }
                });
            });
        });

        // Buy Action Alert
        document.querySelectorAll(".buy-action").forEach(button => {
            button.addEventListener("click", function (event) {
                event.preventDefault();
                alert("Welcome to Food Fiesta! Please Log In as a User to place your order.");
                window.location.href = "/login";
            });
        });
    </script>
</body>

</html>
